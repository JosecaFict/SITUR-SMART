components:
  schemas:
    ApiRootResponse:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        health:
          type: string
        docs:
          type: string
        schema:
          type: string
      required:
      - docs
      - health
      - name
      - schema
      - version
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/UserContext'
      required:
      - access
      - refresh
      - user
    City:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
        pais_id:
          type: integer
        pais:
          type: string
          readOnly: true
      required:
      - id
      - nombre
      - pais
      - pais_id
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        razon_social:
          type: string
        nombre_comercial:
          type: string
        ciudad_id:
          type: integer
          nullable: true
        ciudad:
          allOf:
          - $ref: '#/components/schemas/City'
          nullable: true
          readOnly: true
        subdominio:
          type: string
        nit:
          type: string
          nullable: true
        email_contacto:
          type: string
          format: email
          nullable: true
        telefono:
          type: string
          nullable: true
        estado:
          type: string
        propietario:
          allOf:
          - $ref: '#/components/schemas/OwnerSummary'
          nullable: true
          readOnly: true
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time
      required:
      - actualizado_en
      - ciudad
      - ciudad_id
      - creado_en
      - email_contacto
      - estado
      - id
      - nit
      - nombre_comercial
      - propietario
      - razon_social
      - subdominio
      - telefono
    CompanyCreate:
      type: object
      properties:
        razon_social:
          type: string
          maxLength: 180
        nombre_comercial:
          type: string
          maxLength: 180
        ciudad_id:
          type: integer
          minimum: 1
          nullable: true
        subdominio:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$
        nit:
          type: string
          maxLength: 30
        email_contacto:
          type: string
          format: email
        telefono:
          type: string
          maxLength: 30
        plan_codigo:
          type: string
          default: BASICO
          maxLength: 50
        propietario:
          $ref: '#/components/schemas/OwnerInput'
      required:
      - nombre_comercial
      - propietario
      - razon_social
    CompanySelfSignup:
      type: object
      properties:
        razon_social:
          type: string
          maxLength: 180
        nombre_comercial:
          type: string
          maxLength: 180
        plan_codigo:
          type: string
          maxLength: 50
        ciudad_id:
          type: integer
          minimum: 1
          nullable: true
        subdominio:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$
        nit:
          type: string
          maxLength: 30
        email_contacto:
          type: string
          format: email
        telefono:
          type: string
          maxLength: 30
        propietario:
          $ref: '#/components/schemas/OwnerInput'
      required:
      - nombre_comercial
      - plan_codigo
      - propietario
      - razon_social
    CompanyUpdateEstadoEnum:
      enum:
      - PENDIENTE
      - ACTIVO
      - INACTIVO
      - SUSPENDIDO
      type: string
      description: |-
        * `PENDIENTE` - Pendiente
