name: mobile
description: "SITUR-SMART: app móvil del turista para descubrir la oferta turística de Bolivia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # Navegación
  go_router: ^17.5.0

  # Manejo de estado
  flutter_riverpod: ^3.4.2

  # Peticiones HTTP hacia Django REST API
  http: ^1.3.0

  # Guardar JWT (access y refresh token)
  shared_preferences: ^2.5.3

  # Abrir la ubicación de un hospedaje en el mapa
  url_launcher: ^6.3.1

  # Notas de voz del asistente: grabar y guardar en un archivo temporal
  record: ^6.1.1

  # Voucher de la reserva
  qr_flutter: ^4.1.0
  path_provider: ^2.1.5


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - web/favicon.png